name: Enforce repository-wide work prohibition
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  isolate-all-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Archive original branch instructions, then prohibit all branch use
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          POLICY='# 절대 작업금지 저장소

          **이곳에서 작업 또는 기준점을 가져가는 것을 절대 금지한다.**

          이 저장소는 보존·격리 대상이다. 모든 브랜치에서 코드·문서·설정·워크플로·릴리즈·아티팩트의 수정, 생성, 삭제, 빌드, 테스트, 배포를 금지한다. 이 저장소의 어떤 브랜치·커밋·태그·파일·구현·패치·로그·산출물도 다른 작업의 기준점·베이스라인·참고 소스·이식 원본으로 가져가거나 사용하지 않는다.

          과거 지침과 개발 지시는 모두 효력을 상실한다. 원본 지침은 _ARCHIVED_PRE_BAN_INSTRUCTIONS/에 역사적 보존 목적으로만 저장하며 절대 참고·재사용하지 않는다. 사용자 명시 지시인 격리 규정의 보존·전파·검증만 허용한다. main을 포함한 모든 브랜치에 예외 없이 적용한다.'
          mapfile -t BRANCHES < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | sed 's#^origin/##' | grep -v '^HEAD$' | sort -u)
          # Phase 1: copy every branch's original instruction files into main before touching any branch.
          for branch in "${BRANCHES[@]}"; do
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in _ARCHIVED_PRE_BAN_INSTRUCTIONS/*) continue;; esac
              safe_branch="${branch//\//__}"
              archive="_ARCHIVED_PRE_BAN_INSTRUCTIONS/branches/$safe_branch/$path.txt"
              [ -e "$archive" ] && continue
              mkdir -p "$(dirname "$archive")"
              git show "origin/$branch:$path" > "$archive"
              printf '\nSOURCE_BRANCH=%s\nSOURCE_PATH=%s\n' "$branch" "$path" >> "$archive"
            done < <(git ls-tree -r --name-only "origin/$branch" | grep -E '(^|/)(AGENTS\.md|README\.md|GLOBAL_DEVELOPMENT_BASELINE\.md|.*(DIRECTIVE|INSTRUCTION|POLICY|BASELINE|SIGNING_IDENTITY|CONTRIBUTING|RULES).*\.md)$' || true)
          done
          git add _ARCHIVED_PRE_BAN_INSTRUCTIONS
          if ! git diff --cached --quiet; then
            git commit -m "Archive pre-prohibition instructions from every branch"
            git push origin HEAD:main
          fi
          # Phase 2: rewrite instruction entry points on every branch; no code or assets are touched.
          for branch in "${BRANCHES[@]}"; do
            git checkout -B __repository_isolation_work "origin/$branch"
            mapfile -t FILES < <(git ls-tree -r --name-only "origin/$branch" | grep -E '(^|/)(AGENTS\.md|README\.md|GLOBAL_DEVELOPMENT_BASELINE\.md|.*(DIRECTIVE|INSTRUCTION|POLICY|BASELINE|SIGNING_IDENTITY|CONTRIBUTING|RULES).*\.md)$' || true)
            printf '%s\n' "$POLICY" > AGENTS.md
            for path in "${FILES[@]}"; do
              [ -n "$path" ] || continue
              case "$path" in _ARCHIVED_PRE_BAN_INSTRUCTIONS/*) continue;; esac
              printf '%s\n' "$POLICY" > "$path"
            done
            git add -A AGENTS.md "${FILES[@]}"
            if ! git diff --cached --quiet; then
              git commit -m "Enforce absolute no-work and no-baseline prohibition"
              git push origin HEAD:"$branch"
            fi
          done
          git checkout -B __repository_isolation_work origin/main
